# .github/workflows/deploy-prod.yml
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g., main-a1b2c3d or latest)"
        required: true
        type: string

env:
  DEPLOY_PATH: /opt/library
  VAULT_ADDR: https://vault.nanobyte.ca

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "${{ github.event.inputs.tag }}" =~ ^(master-[a-f0-9]{7,}|main-[a-f0-9]{7,}|latest)$ ]]; then
            echo "::error::Invalid tag format. Expected: master-<short-sha>, main-<short-sha>, or latest"
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch secrets from Vault
        run: |
          TAG="${{ github.event.inputs.tag }}"

          echo "Authenticating to Vault..."
          VAULT_TOKEN=$(curl -sf \
            --request POST \
            --data "{\"role_id\": \"${{ secrets.VAULT_ROLE_ID }}\", \"secret_id\": \"${{ secrets.VAULT_SECRET_ID }}\"}" \
            "${VAULT_ADDR}/v1/auth/approle/login" | jq -r '.auth.client_token')

          if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
            echo "::error::Failed to authenticate to Vault — received null token"
            exit 1
          fi
          echo "Vault authentication successful"

          # Generate .env from two Vault tiers
          > /tmp/deploy.env

          # Tier 1: Common secrets
          echo "Fetching common secrets..."
          COMMON_JSON=$(curl -sf \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/secret/data/library/common" | jq -r '.data.data // "{}"')
          if [ "$COMMON_JSON" != "{}" ]; then
            echo "$COMMON_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> /tmp/deploy.env
            echo "Exported $(echo "$COMMON_JSON" | jq -r 'keys | length') keys from library/common"
          fi

          # Tier 2: Environment-specific secrets (prod)
          echo "Fetching secrets for environment: prod..."
          ENV_JSON=$(curl -sf \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/secret/data/library/prod" | jq -r '.data.data // "{}"')
          if [ "$ENV_JSON" != "{}" ]; then
            echo "$ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> /tmp/deploy.env
            echo "Exported $(echo "$ENV_JSON" | jq -r 'keys | length') keys from library/prod"
          fi

          # Append IMAGE_TAG
          echo "IMAGE_TAG=${TAG}" >> /tmp/deploy.env

          # Validate
          KEY_COUNT=$(wc -l < /tmp/deploy.env)
          echo "Generated .env with ${KEY_COUNT} keys"

          if [ "$KEY_COUNT" -lt 2 ]; then
            echo "::error::Secrets validation failed — expected multiple keys, got ${KEY_COUNT}"
            exit 1
          fi

          echo "Secrets fetched successfully"

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH via Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat >> ~/.ssh/config << EOF
          Host deploy
            HostName ${{ secrets.SERVER_HOSTNAME }}
            User deploy
            IdentityFile ~/.ssh/deploy_key
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Deploy to production
        run: |
          TAG="${{ github.event.inputs.tag }}"

          # Copy compose file and .env to server
          echo "Uploading docker-compose.yml and .env to server..."
          scp deploy/prod/docker-compose.yml deploy:${DEPLOY_PATH}/prod/docker-compose.yml
          scp /tmp/deploy.env deploy:${DEPLOY_PATH}/prod/.env

          ssh deploy << REMOTE_SCRIPT
            set -euo pipefail
            cd ${DEPLOY_PATH}/prod

            echo "=== Deploying ${TAG} to prod ==="

            # Authenticate to GHCR
            GH_PROJECT_TOKEN=\$(grep '^GHCR_TOKEN=' .env | cut -d= -f2- || echo "${{ secrets.GITHUB_TOKEN }}")
            echo "Logging in to GHCR..."
            echo "\$GH_PROJECT_TOKEN" | docker login ghcr.io -u nanobyte-canada --password-stdin

            # Pull new images
            echo "Pulling images..."
            docker compose pull

            # Restart services
            echo "Starting services..."
            docker compose up -d

            # Wait for health checks
            echo "Waiting for health checks..."
            sleep 15

            # Check container status
            echo "Container status:"
            docker compose ps

            # Health gate
            UNHEALTHY=\$(docker compose ps --format json | jq -r 'select(.Health != "healthy" and .Health != "" and .State != "running") | .Name' 2>/dev/null || true)
            if [ -n "\$UNHEALTHY" ]; then
              echo "WARNING: Unhealthy containers: \$UNHEALTHY"
              docker compose logs --tail=50 \$UNHEALTHY
              exit 1
            fi

            echo "=== Deploy complete ==="
          REMOTE_SCRIPT

      - name: Health gate
        run: |
          echo "Checking health at https://library.nanobyte.ca/ ..."
          for i in $(seq 1 30); do
            STATUS=$(curl -sf "https://library.nanobyte.ca/api/health" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "DOWN")
            if [ "$STATUS" = "UP" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 5 minutes"
          exit 1

      - name: Cleanup
        if: always()
        run: rm -f /tmp/deploy.env

      - name: Post deploy summary
        if: success()
        run: |
          echo "### Deploy Successful :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** prod" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${{ github.event.inputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Secrets:** Fetched from Vault" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ job.status == 'success' && ':rocket:' || ':x:' }} Library deploy *${{ github.event.inputs.tag }}* to *prod* ${{ job.status }}\nTriggered by: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
