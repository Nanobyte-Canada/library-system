name: UI Tests — Deployed (UAT)

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - all

concurrency:
  group: library-uat-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployed-tests:
    name: UAT browser tests
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Type-check platform scripts
        working-directory: e2e
        run: npm run typecheck

      - name: Run suite
        working-directory: e2e
        env:
          BASE_URL: https://uatlibrary.nanobyte.ca
        run: |
          if [ "${{ inputs.suite }}" = "all" ]; then
            npx playwright test --grep '@smoke|@regression'
          else
            npx playwright test --grep '@smoke'
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-deployed-${{ github.run_id }}
          path: |
            e2e/report
            e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Notify Slack
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: UAT UI tests failed — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
